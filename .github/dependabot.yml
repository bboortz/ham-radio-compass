# Shepherd-managed .github/dependabot.yml (SH-011).
# Baseline: github-actions + npm. See https://github.com/bboortz/shepherd
# This repo opts into Dependabot auto-merge via .shepherd.yml;
# see .github/workflows/dependabot-automerge.yml for the gate logic.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
