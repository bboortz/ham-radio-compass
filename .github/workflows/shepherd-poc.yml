---
# Shepherd caller (SH-007 R1-A). Replaced the R0 copied-scripts flow with
# a thin uses: of bboortz/shepherd's reusable workflow. SHA-pinned to the
# commit that shipped v0.5.0-rc1.
#
# The SH-005 inject_fixture one-shot capability is dropped by this migration;
# the R0 live drill (2026-11-21) already closed the exit-criterion. Future
# injection coverage runs via `make injection-drill` on shepherd itself.
name: shepherd
"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@3550c80ed15bd8cd9a150dc61dbe2dc9744a90b5
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
